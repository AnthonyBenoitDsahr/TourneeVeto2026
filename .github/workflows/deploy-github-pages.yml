name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Blazor WebAssembly app
        run: dotnet publish src/TourneeVeto.Web/TourneeVeto.Web.csproj --configuration Release --output publish

      - name: Configure GitHub Pages paths
        shell: bash
        env:
          PUBLISH_DIR: publish/wwwroot
          REPOSITORY: ${{ github.repository }}
        run: |
          owner="${REPOSITORY%%/*}"
          repository="${REPOSITORY#*/}"
          if [[ "$repository" == "${owner}.github.io" ]]; then
            base_path="/"
          else
            base_path="/${repository}/"
          fi

          index_file="${PUBLISH_DIR}/index.html"
          service_worker_file="${PUBLISH_DIR}/service-worker.js"
          not_found_file="${PUBLISH_DIR}/404.html"

          grep -Fq '<base href="/" />' "$index_file"
          grep -Fq 'const base = "/";' "$service_worker_file"
          grep -Fq '__BASE_PATH__' "$not_found_file"
          sed -i "s|<base href=\"/\" />|<base href=\"${base_path}\" />|" "$index_file"
          sed -i "s|const base = \"/\";|const base = \"${base_path}\";|" "$service_worker_file"
          sed -i "s|__BASE_PATH__|${base_path}|" "$not_found_file"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
